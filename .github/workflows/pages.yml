name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website files
        shell: bash
        run: |
          install -d "$RUNNER_TEMP/dot2-public"
          cp -- index.html business.html privacy.html styles.css business.css carousel.js quote.js "$RUNNER_TEMP/dot2-public/"
          cp -R -- assets "$RUNNER_TEMP/dot2-public/assets"
          touch "$RUNNER_TEMP/dot2-public/.nojekyll"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/dot2-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
